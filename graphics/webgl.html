<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Mobile Terminal WebGL pending</title>
<canvas width="256" height="256"></canvas>
<p id="result">正在测试 WebGL</p>
<script>
const result = document.querySelector('#result');
const gl = document.querySelector('canvas').getContext('webgl', {
    failIfMajorPerformanceCaveat: true, preserveDrawingBuffer: true
});
function report(status, detail) {
    document.title = 'Mobile Terminal WebGL ' + status + ' ' + detail;
    result.textContent = document.title;
}
if (!gl) {
    report('FAIL', 'WebGL unavailable');
} else {
    const debug = gl.getExtension('WEBGL_debug_renderer_info');
    const renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : '';
    const pixel = new Uint8Array(4);
    gl.clearColor(1, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.readPixels(128, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    if (gl.getError() === gl.NO_ERROR && pixel.join(',') === '255,0,0,255' && /adreno/i.test(renderer)) {
        report('OK', renderer);
    } else {
        report('FAIL', renderer || 'renderer or pixel readback unavailable');
    }
}
</script>
</html>
